<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주간 보고 통합 · 2026-08-17~08-22 (8월 17일~8월 22일)</title>
<style>
  /* 헤더 높이를 픽셀로 고정하지 않는다 — 탭에 KPI 줄이 붙으면 높이가 변해 iframe이 서브바를 덮는다 */
  html,body{height:100%;margin:0;font-family:-apple-system,'Malgun Gothic',sans-serif;background:#0f172a}
  body{display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#0f172a;color:#fff;border-bottom:1px solid #1e293b;flex-wrap:wrap;flex:0 0 auto}
  .topbar .title{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .topbar .period{font-size:12px;color:#94a3b8}
  .tabs{display:flex;gap:8px;margin-left:auto}
  .tab{padding:8px 18px;border:none;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
  .tab:hover{background:#334155;color:#fff}
  .tab.active{background:#6366f1;color:#fff;box-shadow:0 2px 10px rgba(99,102,241,.4)}
  .tab .kpi{display:block;font-size:10.5px;font-weight:600;opacity:.75;margin-top:1px}
  .subbar{display:flex;align-items:center;gap:8px;padding:8px 18px;background:#111c33;border-bottom:1px solid #1e293b;flex:0 0 auto;flex-wrap:wrap}
  .sub{padding:6px 15px;border:none;border-radius:8px;background:#1e293b;color:#cbd5e1;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
  .sub:hover{background:#334155;color:#fff}
  .sub.active{background:#e2e8f0;color:#0f172a}
  .sub.brief.active{background:#7c3aed;color:#fff}
  .sub-hint{margin-left:auto;font-size:11px;color:#64748b}
  .sub-hint b{color:#fbbf24}
  .note{padding:7px 18px;background:#3b2f0b;color:#fde68a;font-size:11.5px;flex:0 0 auto;border-bottom:1px solid #57430f}
  .stage{flex:1 1 auto;min-height:0;position:relative}
  iframe{width:100%;height:100%;border:0;background:#fff;display:block}
  @media(max-width:820px){
    .tabs{margin-left:0;width:100%;flex-wrap:wrap}
    .tab{flex:1 1 auto;min-width:118px}
    .sub-hint{margin-left:0;width:100%}
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">📊 주간 보고 통합</span>
    <span class="period">2026-08-17 ~ 08-22 (지난주 · 8월 17일~8월 22일)</span>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="subbar">
    <button class="sub" data-view="weekly" onclick="setView('weekly')">📋 주간보고서</button>
    <button class="sub brief" data-view="brief" onclick="setView('brief')">▶ 보고모드</button>
    <button class="sub" data-view="ads" onclick="setView('ads')">📈 광고분석</button>
    <span class="sub-hint" id="subHint"></span>
  </div>
  <div class="note">⚠️ 매출·마진은 BigQuery 기준입니다 (유통 시트 cafe24·smartstore가 8/11에서 멈춤). 매출·ROAS는 확정값, 마진·순마진은 과거 주차와 기준이 다르고 인플루언서·멀티 차감이 미적용입니다.</div>
  <div class="stage"><iframe id="frame" src=""></iframe></div>

<script>
/* 부모 주도 연속 보고모드 — 통합뷰가 iframe 보고모드를 시작·완료감지·전환.
   동일 출처(GitHub Pages https)에서만 동작.
   ※ scripts/build_combined_report.py 가 생성한다. 직접 수정하지 말 것. */
var REPORTS = [
  { name:"릴렉스틱볼", kpi:"ROAS 571.0% · 순마진 +681만",
    weekly:"릴렉스틱볼_weekly_0824.html", ads:"릴렉스틱볼_광고분석_260803.html", adsOld:true, adsNote:"광고분석은 260803본(이번 주차 아님)" },
  { name:"릴렉스틱", kpi:"ROAS 475.4% · 순마진 +1,142만",
    weekly:"릴렉스틱_weekly_0824.html", ads:"릴렉스틱_광고분석_260803.html", adsOld:true, adsNote:"광고분석은 260803본(이번 주차 아님)" },
  { name:"잔망루피", kpi:"ROAS 517.5% · 순마진 +851만",
    weekly:"루피_weekly_0824.html", ads:"루피_광고분석_260803.html", adsOld:true, adsNote:"광고분석은 260803본(이번 주차 아님)" }
];
var CB = Date.now();
var cur = 0, view = "weekly", briefStage = null;
var poll = null, wasRun = false, lastEnd = false, advanced = false;
var tabs = document.getElementById('tabs');
var frame = document.getElementById('frame');
var subHint = document.getElementById('subHint');

REPORTS.forEach(function(r, i){
  var b = document.createElement('button');
  b.className = 'tab' + (i===0?' active':'');
  b.innerHTML = r.name + (r.kpi ? '<span class="kpi">' + r.kpi + '</span>' : '');
  b.onclick = function(){ setProduct(i); };
  tabs.appendChild(b);
});

function docFor(){
  var r = REPORTS[cur];
  if(view==='ads') return r.ads;
  if(view==='brief') return (briefStage==='ads') ? r.ads : r.weekly;
  return r.weekly;
}
function bstate(){
  try{
    var d = frame.contentDocument; if(!d) return {run:false, end:false};
    var run = d.body.classList.contains('brief-active') || d.body.classList.contains('brief-on');
    var c = d.getElementById('bbCount') || d.getElementById('bCount');
    var end = false;
    if(c){ var m = (c.textContent||'').match(/(\d+)\s*\/\s*(\d+)/); if(m) end = (m[1]===m[2]); }
    return {run:run, end:end};
  }catch(e){ return {run:false, end:false}; }
}
function startBrief(){
  try{
    var w = frame.contentWindow, d = frame.contentDocument;
    if(w && typeof w.briefNext === 'function'){ w.briefNext(); return; }
    if(d){ var b = d.getElementById('bNext'); if(b){ b.click(); return; } }
  }catch(e){}
}
function stopBrief(){
  try{
    var w = frame.contentWindow, d = frame.contentDocument;
    if(w && typeof w.briefExit === 'function'){ w.briefExit(); return; }
    if(d && d.body.classList.contains('brief-on')){ var x = d.getElementById('bExit'); if(x) x.click(); }
  }catch(e){}
}
function adsWarn(){ return REPORTS[cur].adsOld ? ' · <b>' + REPORTS[cur].adsNote + '</b>' : ''; }
function render(){
  tabs.querySelectorAll('.tab').forEach(function(b,i){ b.classList.toggle('active', i===cur); });
  document.querySelectorAll('.sub').forEach(function(b){ b.classList.toggle('active', b.dataset.view===view); });
  subHint.innerHTML =
      (view==='brief' && briefStage==='ads') ? '연속 보고 — 광고분석 (→/← 진행, 끝나면 다음 제품)' + adsWarn()
    : (view==='brief') ? '연속 보고 — 주간보고서 (끝나면 광고분석 → 다음 제품)'
    : (view==='weekly') ? '보고모드 탭으로 연속 브리핑 시작'
    : (view==='ads') ? '지난주 기준 리포트' + adsWarn() : '';
  clearInterval(poll); poll=null; wasRun=false; lastEnd=false;
  var want = encodeURIComponent(docFor()) + '?v=' + CB;
  if(frame.getAttribute('src') !== want){
    frame.onload = function(){ frame.onload=null; afterLoad(); };
    frame.setAttribute('src', want);
  } else { afterLoad(); }
}
function afterLoad(){
  advanced = false;
  if(view==='brief'){
    setTimeout(function(){ startBrief(); try{ frame.contentWindow.focus(); }catch(e){} beginPoll(); }, 300);
  } else { stopBrief(); }
}
function beginPoll(){
  clearInterval(poll); wasRun=false; lastEnd=false;
  poll = setInterval(function(){
    var s = bstate();
    if(s.run){ wasRun = true; lastEnd = s.end; }
    else if(wasRun){ clearInterval(poll); poll=null; wasRun=false; if(lastEnd) advance(); }
  }, 200);
}
function advance(){
  if(advanced || view!=='brief') return;
  advanced = true;
  if(briefStage==='weekly'){ view='brief'; briefStage='ads'; render(); }
  else {
    if(cur < REPORTS.length-1){ cur+=1; view='brief'; briefStage='weekly'; render(); }
    else { view='ads'; briefStage=null; render(); }
  }
}
function setProduct(i){ cur=i; if(view==='brief'){ view='weekly'; briefStage=null; } render(); }
function setView(v){ briefStage = (v==='brief') ? 'weekly' : null; view=v; render(); }

window.addEventListener('message', function(e){
  var d = e.data || {};
  if(d.type==='brief:done'){ advance(); return; }
  if(d.type==='brief:started'){
    if(view!=='brief'){
      briefStage = (view==='ads') ? 'ads' : 'weekly';
      view = 'brief';
      document.querySelectorAll('.sub').forEach(function(b){ b.classList.toggle('active', b.dataset.view===view); });
      subHint.innerHTML = (briefStage==='ads')
        ? '연속 보고 — 광고분석 (→/← 진행, 끝나면 다음 제품)' + adsWarn()
        : '연속 보고 — 주간보고서 (끝나면 광고분석 → 다음 제품)';
    }
    advanced = false; beginPoll();
  }
});

render();
</script>
</body>
</html>
