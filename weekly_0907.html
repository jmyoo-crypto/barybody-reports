<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barybody 주간 유료광고 원페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">

<style>
/* ============================================================
   주간 유료광고 원페이지. 비교 기준은 지지난주 -> 지난주.
   1면 = 결정, 2면 = 채널별 상세.
   페이지 아이덴티티는 무채색. 채도는 데이터에만 준다.
   ============================================================ */
:root {
  color-scheme: light;
  --ink:#1f262c; --ink-2:#4a555e; --ink-3:#78848d;
  --paper:#eef0f2; --surface:#ffffff; --surface-2:#f7f8f9;
  --line:#dde1e5; --line-2:#c6ccd2;
  --accent:#2a78d6;
  --good:#0e7c5a; --good-bg:#e4f2ec; --bad:#b3261e; --bad-bg:#f8e7e5;
  --prev:#86b6ef; --curr:#2a78d6;
  --grid:#e6e9ec; --tip-bg:#1f262c; --tip-ink:#ffffff;
  --mark:#fdf0c8;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink:#eef1f3; --ink-2:#b3bcc4; --ink-3:#828d96;
    --paper:#15191d; --surface:#1e2429; --surface-2:#242b31;
    --line:#333c44; --line-2:#46515a; --accent:#3987e5;
    --good:#3fbf92; --good-bg:#16302a; --bad:#e66767; --bad-bg:#35211f;
    --prev:#1c5cab; --curr:#3987e5;
    --grid:#2c343a; --tip-bg:#eef1f3; --tip-ink:#1f262c;
    --mark:#4a3d18;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink:#eef1f3; --ink-2:#b3bcc4; --ink-3:#828d96;
  --paper:#15191d; --surface:#1e2429; --surface-2:#242b31;
  --line:#333c44; --line-2:#46515a; --accent:#3987e5;
  --good:#3fbf92; --good-bg:#16302a; --bad:#e66767; --bad-bg:#35211f;
  --prev:#1c5cab; --curr:#3987e5;
  --grid:#2c343a; --tip-bg:#eef1f3; --tip-ink:#1f262c;
    --mark:#4a3d18;
}

* { box-sizing: border-box; }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
/* 한국어는 어절 단위로 줄바꿈한다. 단어 중간에서 잘리지 않게. */
p, li, dd, .sub, .cap, .rule, .a { word-break:keep-all; overflow-wrap:break-word; }
.sheet {
  max-width:900px; margin:24px auto; padding:34px 38px 30px;
  background:var(--surface); border:1px solid var(--line);
  display:flex; flex-direction:column; gap:20px;
}
.sheet + .sheet { margin-top:0; }

.eyebrow { font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); }
h1,h2,h3 { margin:0; text-wrap:balance; font-weight:600; }
h2 { font-size:13px; color:var(--ink); }
h3 { font-size:12px; color:var(--ink); }

.head { display:flex; justify-content:space-between; align-items:flex-start; gap:32px; padding-bottom:17px; border-bottom:1px solid var(--line-2); }
.head h1 { font-size:29px; font-weight:700; letter-spacing:-.025em; line-height:1.12; }
.head .sub { margin-top:6px; font-size:12.5px; line-height:1.5; color:var(--ink-2); }

/* 제품 토글 */
.switch { max-width:900px; margin:24px auto 0; display:flex; gap:6px; }
.switch button {
  font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:-.01em;
  padding:8px 16px; border:1px solid var(--line-2); border-radius:3px;
  background:var(--surface); color:var(--ink-3); cursor:pointer;
}
.switch button[aria-current="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.switch button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.lede { display:flex; flex-direction:column; gap:7px; margin:0; }
.lede > div { display:grid; grid-template-columns:38px 1fr; gap:12px; align-items:baseline; }
.lede dt {
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.06em;
  color:var(--ink-3); text-transform:uppercase;
}
.lede .ltext { display:flex; flex-direction:column; gap:4px; }
.lede p { margin:0; font-size:15.5px; line-height:1.45; letter-spacing:-.012em; }
.lede b { font-weight:600; }
.lede .neg { color:var(--bad); font-weight:600; }

.stats { display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.stat { padding:12px 13px 13px; }
.stat + .stat { border-left:1px solid var(--line); }
.stat .k { font-size:11px; color:var(--ink-3); font-weight:500; }
.stat .v { margin-top:4px; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; letter-spacing:-.035em; line-height:1.05; }
.stat .v small { font-size:11.5px; font-weight:500; margin-left:2px; color:var(--ink-2); letter-spacing:0; }
.stat .d { margin-top:5px; font-family:var(--mono); font-size:10.5px; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:4px; }
.d.up { color:var(--good); } .d.down { color:var(--bad); }
.d .cmp { color:var(--ink-3); }
.stat .ref { margin-top:3px; font-family:var(--mono); font-size:9.5px; color:var(--ink-3); line-height:1.35; }

.cols { display:grid; grid-template-columns:1fr 1.15fr; gap:24px; align-items:start; }
.block { display:flex; flex-direction:column; gap:9px; }
.block-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }

.legend { display:flex; flex-wrap:wrap; gap:11px; }
.legend span { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-2); }
.legend i { width:9px; height:9px; border-radius:2px; display:block; }
figure { margin:0; }
figure svg { display:block; width:100%; height:auto; overflow:visible; }
figcaption { margin-top:7px; font-size:10.5px; color:var(--ink-3); line-height:1.45; }
.bar { cursor:default; }
.bar:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

#tip { position:fixed; z-index:20; pointer-events:none; background:var(--tip-bg); color:var(--tip-ink); padding:7px 9px; border-radius:3px; font-family:var(--mono); font-size:11px; line-height:1.45; font-variant-numeric:tabular-nums; white-space:nowrap; opacity:0; transition:opacity .1s; }
#tip.on { opacity:1; }
#tip b { font-weight:600; }

table { width:100%; border-collapse:collapse; font-size:12px; }
th,td { text-align:right; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:10px; font-family:var(--mono); font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); border-bottom-color:var(--line-2); line-height:1.35; }
th:first-child, td:first-child { text-align:left; padding-left:0; }
th:last-child, td:last-child { padding-right:0; }
td.n { font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
tbody tr:last-child td { border-bottom:none; }
tr.sum td { border-top:1px solid var(--line-2); font-weight:600; }
td.name { line-height:1.4; }
td.name small { display:block; font-size:10.5px; color:var(--ink-3); font-weight:400; }
td.neg { color:var(--bad); font-weight:600; }
td.na { color:var(--ink-3); }

.pill { display:inline-block; font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.04em; padding:2px 6px; border:1px solid currentColor; border-radius:2px; white-space:nowrap; }
.pill.up { color:var(--good); background:var(--good-bg); }
.pill.hold { color:var(--ink-2); background:var(--surface-2); }
.pill.down { color:var(--bad); background:var(--bad-bg); }

.wow { font-family:var(--mono); font-size:10.5px; font-variant-numeric:tabular-nums; }
.wow.up { color:var(--good); } .wow.down { color:var(--bad); } .wow.same { color:var(--ink-3); }

/* 강조 마크. 그 문단에서 한 번만 쓴다. */
mark { background:var(--mark); color:inherit; padding:0 3px; border-radius:2px; font-weight:600; }

.rule { margin:6px 0 0; font-size:10.5px; line-height:1.5; color:var(--ink-3); display:flex; flex-direction:column; gap:3px; }
.rule p { margin:0; }
.rule b { font-weight:600; color:var(--ink-2); }

td.owner { font-family:var(--mono); font-size:11px; white-space:nowrap; }

.drill { display:flex; flex-direction:column; gap:22px; }
.drill section { display:flex; flex-direction:column; gap:8px; }
.drill .cap { font-size:11px; color:var(--ink-3); line-height:1.5; margin:0; display:flex; flex-direction:column; gap:3px; }
.drill .cap p { margin:0; }
.drill .hd { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.drill .hd .spend { font-family:var(--mono); font-size:11px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.tablewrap { overflow-x:auto; }

/* 분석 프레임: 결과 → 원인 → 액션 */
.frame { display:flex; flex-direction:column; gap:7px; margin:0; }
.frame .row { display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:baseline; }
.frame dt {
  font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-3); padding-top:2px;
}
.frame dd { margin:0; font-size:12.5px; line-height:1.55; }
.frame .axis { font-family:var(--mono); font-size:10.5px; color:var(--ink-2); }
.chain { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:2px; }
.chain li { font-size:12px; line-height:1.5; padding-left:13px; position:relative; }
.chain li::before { content:"└"; position:absolute; left:0; color:var(--ink-3); font-family:var(--mono); }
.chain li:first-child { padding-left:0; }
.chain li:first-child::before { content:none; }
.chain li.close { color:var(--ink); font-weight:600; }
.agenda { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; }
.agenda > li > b { font-size:12px; font-weight:600; }
.agenda ul { margin:2px 0 0; padding-left:15px; }
.agenda ul li { font-size:12px; line-height:1.5; color:var(--ink-2); }

.situation {
  border:1px solid var(--line-2); background:var(--surface-2);
  padding:12px 15px; display:flex; flex-direction:column; gap:6px;
}
.situation h2 { font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-weight:500; }
.situation p { margin:0; font-size:12.5px; line-height:1.55; }
.situation .todo { color:var(--bad); font-weight:600; }
.rank { font-size:12.5px; line-height:1.6; margin:0; }
.rank b { font-weight:600; }
.rank .sh { font-family:var(--mono); font-size:11px; color:var(--ink-3); }

/* 볼륨 -> 효율 전개 */
.vol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.vol li { display:grid; grid-template-columns:66px 1fr; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); }
.vol li:last-child { border-bottom:none; }
.vol .st { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.05em; color:var(--ink-3); padding-top:3px; }
.vol .q { font-size:12px; font-weight:600; color:var(--ink); margin:0 0 4px; }
.vol .a { font-size:12.5px; line-height:1.55; color:var(--ink-2); margin:0; }
.vol .a + .a { margin-top:2px; }
.vol .a b { color:var(--ink); font-weight:600; }
.vol .calc {
  display:inline-block; font-family:var(--mono); font-size:11px;
  font-variant-numeric:tabular-nums; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:2px; padding:2px 7px; margin:1px 0;
}

.ev { font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.06em; padding:1px 5px; border:1px solid currentColor; border-radius:2px; }
.ev.pass { color:var(--good); }
.ev.unknown { color:var(--ink-3); }

@media (max-width:760px) {
  .sheet { margin:0; padding:24px 20px; border:none; }
  .head { flex-direction:column; gap:16px; }
  .stats { grid-template-columns:repeat(2,1fr); }
  .stat:nth-child(odd) { border-left:none; }
  .stat:nth-child(n+3) { border-top:1px solid var(--line); }
  .cols { grid-template-columns:1fr; gap:22px; }
  .lede p { font-size:14.5px; }
}

@media print {
  @page { size:A4 portrait; margin:11mm; }
  body { background:#fff; font-size:11.5px; }
  .sheet { margin:0; padding:0; border:none; max-width:none; gap:14px; }
  .sheet.page2 { break-before:page; }
  .switch { display:none; }
  .head h1 { font-size:24px; }
  .lede p { font-size:13px; }
  .stat .v { font-size:19px; }
  .drill section { break-inside:avoid; }
}
</style>
</head>
<body>

<!-- ===================== 1면: 결정 ===================== -->
<!-- 제품 토글 -->
<nav class="switch" id="p-switch" aria-label="제품 선택"></nav>

<div class="sheet">
  <header class="head">
    <div>
      <p class="eyebrow" style="margin:0 0 7px">주간 유료광고 원페이지</p>
      <h1 id="p-name"></h1>
      <p class="sub" id="p-sub"></p>
    </div>
  </header>

  <div class="lede" id="p-lede"></div>

  <div class="stats" id="p-stats"></div>

  <div class="cols">
    <section class="block">
      <div class="block-head">
        <h2>마케팅 채널별 광고비</h2>
        <div class="legend" id="p-legend"></div>
      </div>
      <figure>
        <svg id="chart" viewBox="0 0 460 252" role="img" aria-labelledby="chart-t"></svg>
        <figcaption id="chart-t"></figcaption>
      </figure>
    </section>

    <section class="block">
      <div class="block-head"><h2>페이드채널 실매출과 광고 후 마진</h2></div>
      <div class="tablewrap"><table id="p-sales"></table></div>
      <p class="rule" id="p-sales-note"></p>
    </section>
  </div>

  <section class="block">
    <div class="block-head"><h2>마케팅 채널별 효율</h2></div>
    <div class="tablewrap"><table id="p-chaneff"></table></div>
    <p class="rule" id="p-chaneff-note"></p>
  </section>

</div>

<!-- ===================== 2면: 채널별 상세 ===================== -->
<div class="sheet page2">
  <header class="head" style="padding-bottom:14px">
    <div>
      <p class="eyebrow" style="margin:0 0 7px">2면 · 채널 상세</p>
      <h1 style="font-size:22px">근거와 액션</h1>
      <p class="sub">메타 소재 건강 판정, 캠페인 단위 분해, 이번 주 액션. 기간은 1면과 같다.</p>
    </div>
  </header>

  <section class="situation" id="p-situation"></section>

  <section class="block">
    <div class="block-head"><h2>메타 소재 건강 · 4계층 판정</h2></div>
    <div class="tablewrap"><table id="p-metahealth"></table></div>
    <p class="rule" id="p-metahealth-note"></p>
  </section>

  <div class="drill" id="p-drill"></div>

  <section class="block">
    <div class="block-head"><h2>이번 주 액션</h2></div>
    <div class="tablewrap"><table id="p-actions"></table></div>
  </section>
</div>

<div id="tip" role="status" aria-live="polite"></div>

<script>

    chanEff: [

      { name:"chatgpt", sub:"신규", cost:"16", costDelta:+100.0, sales:"0", salesDelta:0,

   ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const cv = (t) => getComputedStyle(document.documentElement).getPropertyValue(t).trim();
const pct = (a, b) => b ? ((a - b) / b) * 100 : 0;
const won = (n) => n.toLocaleString();
const lines = (v) => (Array.isArray(v) ? v : [v]).map(l => `<p>${l}</p>`).join("");

/* 차트 기하는 고정, 데이터에 따라 바뀌는 값만 렌더 시 갱신 */
const W=460, H=252, PAD={t:34,r:12,b:26,l:44};
const plotW = W-PAD.l-PAD.r, plotH = H-PAD.t-PAD.b;
const barW = 34, gap = 7;
let R, C, DIV = 1, band = plotW;

const yy = v => PAD.t + plotH - (v / C.yMax) * plotH;
const disp = v => Math.round(v / DIV).toLocaleString();

function bar(x, v, fill, label, series) {
  const top = yy(v), h = PAD.t + plotH - top, r = Math.min(4, h);
  const d = h <= 0 ? "" :
    `M${x},${top+h} V${top+r} q0,${-r} ${r},${-r} H${x+barW-r} q${r},0 ${r},${r} V${top+h} Z`;
  return (d ? `<path class="bar" d="${d}" fill="${fill}" tabindex="0"
            data-l="${esc(label)} · ${esc(series)}" data-v="${disp(v)}만원"></path>` : "") +
    `<text x="${x+barW/2}" y="${top-5}" text-anchor="middle"
       font-family="IBM Plex Mono, monospace" font-size="9.5"
       fill="${cv("--ink-3")}">${disp(v)}</text>`;
}

function drawChart() {
  if (!C) return;
  let g = "";
  for (let v = 0; v <= C.yMax; v += C.yStep) {
    const y = yy(v);
    g += `<line x1="${PAD.l}" y1="${y}" x2="${PAD.l+plotW}" y2="${y}"
            stroke="${v===0?cv("--line-2"):cv("--grid")}" stroke-width="1" shape-rendering="crispEdges"/>
          <text x="${PAD.l-8}" y="${y+3.5}" text-anchor="end"
            font-family="IBM Plex Mono, monospace" font-size="9.5"
            fill="${cv("--ink-3")}">${disp(v)}</text>`;
  }
  C.rows.forEach((r, i) => {
    const groupW = barW*2 + gap;
    const x0 = PAD.l + band*i + (band-groupW)/2;
    g += bar(x0, r.prev, cv("--prev"), r.name, C.prevLabel);
    g += bar(x0+barW+gap, r.curr, cv("--curr"), r.name, C.currLabel);
    const d = pct(r.curr, r.prev), up = d >= 0;
    g += `<text x="${x0+groupW/2}" y="${PAD.t-17}" text-anchor="middle"
            font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600"
            fill="${up?cv("--good"):cv("--bad")}">${up?"+":""}${d.toFixed(1)}%</text>`;
    g += `<text x="${x0+groupW/2}" y="${PAD.t+plotH+15}" text-anchor="middle"
            font-family="IBM Plex Sans KR, sans-serif" font-size="11" font-weight="500"
            fill="${cv("--ink-2")}">${esc(r.name)}</text>`;
  });
  $("chart").innerHTML = g;
  $("chart-t").textContent = C.note;
}

/* ---------- 전체 렌더 ---------- */
function render(key) {
  R = REPORTS[key];
  C = R.chart; DIV = C.div || 1; band = plotW / C.rows.length;
  document.title = R.product + " 주간 유료광고 원페이지";

  $("p-name").textContent = R.product;
  $("p-sub").innerHTML = R.subtitle;
  $("p-lede").innerHTML = R.lede
    .map(l => `<div><dt>${esc(l.k)}</dt><div class="ltext">${lines(l.v)}</div></div>`).join("");

  $("p-stats").innerHTML = R.stats.map(s => {
    const rising = s.delta > 0;
    const isGood = (rising && s.good === "up") || (!rising && s.good === "down");
    return `<div class="stat">
      <div class="k">${esc(s.k)}</div>
      <div class="v">${esc(s.v)}<small>${esc(s.unit)}</small></div>
      <div class="d ${isGood?"up":"down"}">
        <span aria-hidden="true">${rising?"▲":"▼"}</span>
        <span>${rising?"+":""}${s.delta.toFixed(1)}${s.pp?"%p":"%"}</span>
        <span class="cmp">지지난주</span>
      </div>
      ${s.ref ? `<div class="ref">${esc(s.ref)}</div>` : ""}
    </div>`;
  }).join("");

  $("p-legend").innerHTML =
    `<span><i style="background:var(--prev)"></i>${esc(C.prevLabel)}</span>` +
    `<span><i style="background:var(--curr)"></i>${esc(C.currLabel)}</span>`;
  drawChart();

  /* 페이드채널 실매출과 광고 후 마진. 반폭이라 값과 증감을 두 줄로 쌓는다. */
  {
    const S = R.salesSum;
    const d1 = (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
    const cell2 = (v, d, extra) => `<td class="n${extra || ""}">${esc(v)}<br><span class="wow ${d >= 0 ? "up" : "down"}">${d1(d)}</span></td>`;
    const na = `<td class="n na">-</td>`;
    const row = (x, cls) => `<tr class="${cls || ""}">
        <td class="name">${esc(x.name)}${x.sub ? `<small>${esc(x.sub)}</small>` : ""}</td>
        ${cell2(x.sales, x.salesDelta)}
        ${cell2(String(x.orders), x.ordersDelta)}
        ${x.cost == null ? na : cell2(x.cost, x.costDelta)}
        <td class="n">${x.bep}%</td>
        ${cell2(x.contrib, x.contribDelta, x.negative ? " neg" : "")}
      </tr>`;
    $("p-sales").innerHTML =
      `<thead><tr><th>페이드채널</th><th>실매출<br>만원</th><th>주문</th><th>광고비<br>만원</th>` +
      `<th>손익<br>분기</th><th>광고 후 마진<br>채널마진−광고비</th></tr></thead>` +
      `<tbody>${R.sales.map(x => row(x)).join("")}` +
      row(Object.assign({ name: "합계", sub: "" }, S), "sum") + `</tbody>`;
    $("p-sales-note").innerHTML = lines(R.salesNote);
  }

  /* 마케팅 채널별 효율. 광고 플랫폼 귀인 기준이므로 주 대 주 방향 비교용이다. */
  {
    const d1 = (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
    const dp = (a, b) => (a - b >= 0 ? "+" : "") + (a - b).toLocaleString() + "%p";
    const roasCol = (x) => x.roas == null
      ? `<span class="na">-</span>`
      : `${x.roas.toLocaleString()}% <span class="wow ${x.roas - x.roasPrev > 0 ? "up" : "down"}">${dp(x.roas, x.roasPrev)}</span>`;
    const cpaCol = (x) => x.cpa == null
      ? `<span class="na">-</span>`
      : `${esc(x.cpa)} <span class="wow ${x.cpaDelta >= 0 ? "down" : "up"}">${d1(x.cpaDelta)}</span>`;
    $("p-chaneff").innerHTML =
      `<thead><tr><th>마케팅 채널</th><th>광고비 만원</th><th>귀인 매출 만원<br>플랫폼 집계</th><th>귀인 ROAS</th><th>귀인 CPA 원</th><th>효율</th></tr></thead>` +
      `<tbody>${R.chanEff.map(x => `<tr>
          <td class="name">${esc(x.name)}${x.sub ? `<small>${esc(x.sub)}</small>` : ""}</td>
          <td class="n">${esc(x.cost)} <span class="wow ${x.costDelta >= 0 ? "up" : "down"}">${d1(x.costDelta)}</span></td>
          <td class="n">${esc(x.sales)} <span class="wow ${x.salesDelta >= 0 ? "up" : "down"}">${d1(x.salesDelta)}</span></td>
          <td class="n">${roasCol(x)}</td>
          <td class="n">${cpaCol(x)}</td>
          <td><span class="pill ${x.tone}">${esc(x.verdict)}</span></td>
        </tr>`).join("")}</tbody>`;
    $("p-chaneff-note").innerHTML = lines(R.chanEffNote);
  }
  $("p-actions").innerHTML =
    `<thead><tr><th style="width:34%">액션</th><th>소유자</th><th style="text-align:left">수용 기준</th></tr></thead>` +
    `<tbody>${R.actions.map(a => `<tr>
        <td>${esc(a.do)}</td>
        <td class="owner">${esc(a.owner)}</td>
        <td style="text-align:left">${esc(a.ac)}</td>
      </tr>`).join("")}</tbody>`;

  /* 2면 - 특수상황 · 영향력 순위 · 볼륨 전개 */
  $("p-situation").innerHTML = `
    <h2>참고 사항 · 특수상황</h2>
    <p>${esc(R.situation.found)}</p>
    <p><span class="todo">[입력 필요]</span> ${esc(R.situation.todo)}</p>`;

  /* 메타 소재 건강 4계층. 노출·도달·빈도·영상지표는 메타 API, 판정은 실매출과 대조. */
  $("p-metahealth").innerHTML =
    `<thead><tr><th>지표</th><th>지지난주</th><th>지난주</th><th>증감</th><th style="text-align:left">해석</th></tr></thead>` +
    `<tbody>${R.metaHealth.map(m => `<tr>
        <td class="name">${esc(m.k)}</td>
        <td class="n">${esc(m.prev)}</td>
        <td class="n">${esc(m.curr)}</td>
        <td class="n">${esc(m.delta)}</td>
        <td style="text-align:left">${m.note}</td>
      </tr>`).join("")}</tbody>`;
  $("p-metahealth-note").innerHTML = lines(R.metaHealthNote);

  /* 2면 - 채널별 결과 · 원인 · 액션 */
  $("p-drill").innerHTML = R.drill.map(d => {
    const table = d.cols.length ? `<div class="tablewrap"><table>
        <thead><tr>${d.cols.map((c,i) => `<th${i===0?' style="width:30%"':""}>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${d.rows.map(r => `<tr>
            <td class="name">${esc(r[0])}<small>${esc(r[1])}</small></td>
            ${r.slice(2).map(v => `<td class="n">${esc(v)}</td>`).join("")}
          </tr>`).join("")}
          ${d.sum ? `<tr class="sum"><td class="name">${esc(d.sum[0])}</td>${d.sum.slice(2).map(v => `<td class="n">${esc(v)}</td>`).join("")}</tr>` : ""}
        </tbody></table></div>` : "";
    const frame = `<dl class="frame">
      <div class="row"><dt>결과</dt><dd>${d.result}</dd></div>
      <div class="row"><dt>원인</dt><dd><ul class="chain">${
        d.chain.map((c,i) => `<li${i===d.chain.length-1?' class="close"':""}>${esc(c)}</li>`).join("")
      }</ul></dd></div>
      <div class="row"><dt>액션</dt><dd><ul class="agenda">${
        d.agenda.map(a => `<li><b>${esc(a.t)}</b><ul>${a.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></li>`).join("")
      }</ul></dd></div>
    </dl>`;
    const ev = d.evidence === "Pass" ? "pass" : "unknown";
    return `<section>
      <div class="hd">
        <h3>${esc(d.title)}</h3>
        <span class="ev ${ev}">${esc(d.evidence)}</span>
        <span class="spend">${esc(d.spend)}</span>
      </div>
      ${frame}
      ${table}
      <div class="cap">${lines(d.note)}</div>
    </section>`;
  }).join("");

  /* 토글 활성 표시 */
  [...$("p-switch").children].forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.key === key)));
  location.hash = key;
}

/* ---------- 제품 토글 ---------- */
$("p-switch").innerHTML = Object.entries(REPORTS)
  .map(([k, r]) => `<button type="button" data-key="${k}" aria-current="false">${esc(r.product)}</button>`).join("");
$("p-switch").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) { render(b.dataset.key); window.scrollTo({ top: 0, behavior: "smooth" }); }
});

/* ---------- 차트 호버 (한 번만 연결) ---------- */
const tip = $("tip");
function showTip(el, cx, cy) {
  tip.innerHTML = `${esc(el.dataset.l)}<br><b>${esc(el.dataset.v)}</b>`;
  tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(innerWidth-r.width-8, Math.max(8, cx-r.width/2)) + "px";
  tip.style.top = Math.max(8, cy-r.height-12) + "px";
}
const hideTip = () => tip.classList.remove("on");
["mouseover","mousemove"].forEach(ev =>
  $("chart").addEventListener(ev, e => { const b = e.target.closest(".bar"); if (b) showTip(b, e.clientX, e.clientY); }));
$("chart").addEventListener("mouseout", hideTip);
$("chart").addEventListener("focusin", e => {
  const b = e.target.closest(".bar"); if (!b) return;
  const r = b.getBoundingClientRect(); showTip(b, r.left+r.width/2, r.top);
});
$("chart").addEventListener("focusout", hideTip);
addEventListener("scroll", hideTip, { passive:true });

/* 테마 변경 시 SVG에 구운 색을 다시 계산한다 */
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawChart);
new MutationObserver(drawChart).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });

/* 첫 렌더. 주소 해시가 있으면 그 제품으로 연다. */
render(REPORTS[location.hash.slice(1)] ? location.hash.slice(1) : Object.keys(REPORTS)[0]);
</script>
</body>
</html>
